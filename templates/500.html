<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Техническая пауза | Golden Brush Studio</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <meta name="theme-color" content="#14161a">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0e11;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-wrapper {
            max-width: 680px;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }
        .error-eyebrow {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #c5a059;
            margin-bottom: 1.25rem;
            font-weight: 500;
        }
        .error-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #ffffff;
            margin: 0 0 1.25rem;
            line-height: 1.2;
            font-weight: 400;
        }
        .error-desc {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: #9ca3af;
            line-height: 1.7;
            margin: 0 0 2.5rem;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn-primary {
            display: inline-block;
            background: #c5a059;
            color: #0d0e11;
            padding: 0.85rem 2rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }
        .error-btn-primary:hover {
            background: #d4b26f;
        }
        .error-btn-secondary {
            display: inline-block;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.85rem 2rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .error-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <div class="error-eyebrow">Код 500 • Техническое обслуживание</div>
        <h1 class="error-title">Временная пауза в цифровой мастерской</h1>
        <p class="error-desc">
            На сервере ведутся технические регламентные работы или обновление архитектурных модулей. Мы уже восстанавливаем штатную работу платформы.
        </p>
        <div class="error-actions">
            <a href="/" class="error-btn-primary">Обновить страницу</a>
            <a href="https://t.me/gbstudio" target="_blank" rel="noopener" class="error-btn-secondary">Написать в Telegram</a>
            <a href="tel:+74958904422" class="error-btn-secondary">+7 (495) 890-44-22</a>
        </div>
    </div>
</body>
</html>
